<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f4f4f5" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded app squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)" />

  <!-- Inner Board Card 1 -->
  <g filter="url(#shadow)">
    <rect x="72" y="96" width="168" height="320" rx="24" fill="url(#card-grad)" />
    <!-- Category strip -->
    <rect x="72" y="96" width="168" height="6" rx="3" fill="url(#accent-grad)" />
    <!-- Card header title placeholder -->
    <rect x="92" y="122" width="80" height="14" rx="7" fill="#18181b" />
    <!-- Task items -->
    <rect x="88" y="160" width="136" height="44" rx="12" fill="#ffffff" stroke="#e4e4e7" stroke-width="2" />
    <circle cx="106" cy="182" r="7" fill="#18181b" />
    <rect x="122" y="177" width="82" height="10" rx="5" fill="#52525b" />

    <rect x="88" y="216" width="136" height="44" rx="12" fill="#ffffff" stroke="#e4e4e7" stroke-width="2" />
    <circle cx="106" cy="238" r="7" fill="#22c55e" />
    <rect x="122" y="233" width="70" height="10" rx="5" fill="#a1a1aa" />

    <rect x="88" y="272" width="136" height="44" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="2" />
    <circle cx="106" cy="294" r="7" fill="#ef4444" />
    <rect x="122" y="289" width="86" height="10" rx="5" fill="#ef4444" />
  </g>

  <!-- Inner Board Card 2 -->
  <g filter="url(#shadow)">
    <rect x="272" y="96" width="168" height="320" rx="24" fill="url(#card-grad)" />
    <!-- Category strip -->
    <rect x="272" y="96" width="168" height="6" rx="3" fill="#3b82f6" />
    <!-- Card header title placeholder -->
    <rect x="292" y="122" width="96" height="14" rx="7" fill="#18181b" />
    <!-- Task items -->
    <rect x="288" y="160" width="136" height="44" rx="12" fill="#ffffff" stroke="#e4e4e7" stroke-width="2" />
    <circle cx="306" cy="182" r="7" fill="#3b82f6" />
    <rect x="322" y="177" width="76" height="10" rx="5" fill="#52525b" />

    <rect x="288" y="216" width="136" height="44" rx="12" fill="#ffffff" stroke="#e4e4e7" stroke-width="2" />
    <circle cx="306" cy="238" r="7" fill="#a1a1aa" />
    <rect x="322" y="233" width="60" height="10" rx="5" fill="#71717a" />

    <!-- Plus add button -->
    <rect x="288" y="348" width="136" height="38" rx="12" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="2" />
    <rect x="351" y="361" width="10" height="12" rx="2" fill="#71717a" />
  </g>
</svg>
